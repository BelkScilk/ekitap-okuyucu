name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zip ac ve APK derle
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          GR=$(find _src -name gradlew -type f | head -1)
          cd "$(dirname "$GR")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ekitap-okuyucu.apk"

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ekitap-okuyucu-apk
          path: ekitap-okuyucu.apk
